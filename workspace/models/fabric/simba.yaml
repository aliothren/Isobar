# Simba reproduction preset (C41, worklist step 1) -- NVIDIA's 36-chiplet
# MCM inference prototype, expressed in our fabric schema at the papers'
# EXPERIMENT operating point, NOT the chip's maximum:
#   core 0.72 V, PE clock 1.03 GHz, GRS 11 Gb/s mode, X-Y routing,
#   batch 1, weights preloaded, layer-sequential  [MICRO'19 §4.1]
# Every number is verbatim-sourced in analysis/papers/simba_extracts.md;
# the pre-registration (analysis/SIMBA_PREREG.md) freezes this file: after
# C41 lands, no parameter here moves to fit a result.
#
# Level mapping (SIMBA_PREREG §4.3): chiplet -> "die"; PE -> "macro" (the
# name our per-op placement machinery operates on); the Global PE is the
# die-level hub. Simba's digital MACs are declared as an abstract
# equivalent-throughput device (device_class: digital_throughput) -- device
# physics is NOT under validation, so there is no CiMLoop macro behind the
# leaf and verify_cycle is a declared no-op (C41 bypass, explicit field).

fabric:
  name: simba-repro
  schedule_slack: 1.0        # the busiest-wire bound itself (C29); the
                             # declared optimistic lower bound for Simba's
                             # hybrid wormhole/cut-through NoC (SIMBA_PREREG §4.2)
  # One "cycle" = one PE clock at the experiment point: 1 / 1.03 GHz.
  # input_slices_per_mvm = 1: t_MVM has no ReRAM meaning here; the leaf's
  # throughput is 1,024 MACs/chiplet/cycle (16 PEs x 8 vector MACs x
  # 8-wide, 8-bit) => 2.11 TOPS/chiplet at 1.03 GHz [MICRO'19 Tab 2, §3.1;
  # JSSC'20 Tab I].
  device:
    name: "Simba PE array (equivalent throughput, 16 nm digital)"
    device_class: digital_throughput
    cycle_seconds: 9.70873786407767e-10     # 1 / 1.03 GHz  [MICRO'19 §4.1]
    input_slices_per_mvm: 1
    calibration: "MICRO'19 §4.1 experiment operating point; Tab 2 microarchitecture"
  # Partial sums are 24-bit on Simba's wires [MICRO'19 Tab 2] = 3 activation
  # words (our psum convention, O23).
  psum_word_bytes: 3.0
  levels:
    - name: package
      per_parent: 1

    # chiplet <-> our "die". 6x6 NoP mesh, one NoP router per chiplet.
    # slot pitch: 47.5 mm package edge / 6 chiplet columns [MICRO'19 Tab 2].
    # Link = the NoP at the EXPERIMENT GRS mode: 4 lanes x 11 Gb/s =
    # 5.5 GB/s per link direction (anchors.SIMBA_EXPERIMENT_GRS_GBPS; the
    # 12.5 GB/s registry anchor is the 25 Gb/s max mode and does NOT move).
    # 20 ns/hop [Tab 2]; energy 10 pJ/word = midpoint of the measured GRS
    # band 0.82-1.75 pJ/bit [JSSC'20 §V-B], same convention as the mlx
    # configs. Pricing scope (C42 review): the 10 pJ/word is per 8-BIT
    # word at the band midpoint; a 24-bit partial sum costs 3x through
    # psum_word_bytes; the ENERGY column is not under test this round --
    # do not quote these as validated Simba energy numbers.
    - name: die
      slot_pitch_um: 7916.7
      per_parent: 36
      mesh: [6, 6]
      link: {name: "die<->die", topology: mesh, params: {routing: xy, hub: center},
             ns_per_hop: 20.0, pj_per_word: 10.0, reference_hops: 1.0,
             bandwidth_gbps: 5.5,
             # A3 packet model: 17-flit packets = 1 header + 16 x 64-bit
             # payload flits -> 128 B payload, 17/16 wire overhead
             # [JSSC'20 §II-C/III-D]
             packet_payload_bytes: 128, packet_wire_overhead: 1.0625,
             calibration: "MICRO'19 §4.1 (11 Gb/s mode) + Tab 2 (20 ns/hop); JSSC'20 §V-B (pJ/bit)"}

    # PE <-> our "macro". 16 PEs on the chiplet's 4x5 NoC mesh; the four
    # spare slots are the Global PE's 3 router stops + the RISC-V [MICRO'19
    # Tab 2: "Routers Per Global PE 3"; JSSC'20 §II-C: 20 NoC destinations].
    # Day-3 wiring places the hub at its true slots; 'hub: center' is the
    # loader-level default until then (SIMBA_PREREG amendment rule applies).
    # Link = the NoC: 70 Gb/s per link at 0.72 V = 8.75 GB/s [JSSC'20
    # §II-C], 10 ns/hop [Tab 2]. pj_per_word 0.0 = honestly uncharged (NoC
    # link energy is not published; energy is not under test here).
    # slot pitch: chiplet 2.4 mm / 4 PE columns = 600 um [Tab 2].
    - name: macro
      slot_pitch_um: 600.0
      per_parent: 16
      mesh: [4, 5]
      link: {name: "glb<->macro", topology: mesh, params: {routing: xy, hub: center},
             ns_per_hop: 10.0, pj_per_word: 0.0, reference_hops: 1.0,
             bandwidth_gbps: 8.75,
             packet_payload_bytes: 128, packet_wire_overhead: 1.0625,
             calibration: "JSSC'20 §II-C (70 Gb/s @ 0.72 V); MICRO'19 Tab 2 (10 ns/hop)"}

  # No CiMLoop arch is bound to this preset: the leaf is closed-form
  # equivalent-throughput (device_class above); day-3 workload wiring
  # decides Timeloop's role for the conv loop nests.
  cimloop: {}
