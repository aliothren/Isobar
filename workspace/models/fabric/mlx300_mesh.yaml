# VARIANT: the die NoC modelled as a 2-D MESH with XY routing instead of the
# default star (private link per macro). Levels are independent -- core and
# crossbar stay star here, which is legal and is the point of per-level schemes.
# Physical fabric of the MLX300-class chip -- the single source of truth for
# level counts, grid geometry, and per-level link parameters. The CiMLoop arch
# YAMLs stay the source of the LOGICAL hierarchy (storage levels, spatial
# fanouts); scripts/fabric.py cross-checks the two and raises on mismatch.
#
# Conventions:
#   levels        top -> bottom. `per_parent` = instances of this level inside
#                 one parent; `mesh` = the [X, Y] grid they occupy in the parent
#                 (slots >= per_parent; spares stay empty -- the gray cells in
#                 the floorplan heatmap).
#   link          the network connecting this level's instances to their
#                 parent's hub (so `macro.link` is the die NoC, `die.link` is
#                 die-to-die). `cimloop_component` marks a link whose energy is
#                 a calibrated CiMLoop component (re-priced by distance);
#                 `pj_per_word: 0.0` records honestly that the level is
#                 currently uncharged.
#   calibration   the data request (DR-x, see SUMMARY section 7) that turns the
#                 placeholder into a calibrated value.
#   bandwidth_words_per_cycle (link)  T2 static-contention input; null = no
#                 limit (today's default -- setting it activates link_occupancy).
#   hub_bandwidth_words_per_cycle (level)  T1 storage bandwidth pushed into
#                 Timeloop (the die's glb); null = no limit. Both are DR-2.

fabric:
  name: mlx300-mesh
  levels:
    - name: package
      per_parent: 1

    - name: die
      per_parent: 1                 # single die instantiated today (DR-3)
      mesh: [1, 1]
      link: {name: "die<->die", topology: star, params: {}, ns_per_hop: 20.0, pj_per_word: null,
             calibration: DR-3}

    - name: macro
      per_parent: 8
      mesh: [3, 3]
      link: {name: "glb<->macro", topology: mesh,
             params: {routing: xy, hub: center, multicast: native},
             cimloop_component: router,
             reference_hops: 1.0, ns_per_hop: 5.0, calibration: DR-4}

    - name: core
      per_parent: 4
      mesh: [2, 2]
      link: {name: "macro<->core", topology: star, params: {}, ns_per_hop: 2.0, pj_per_word: 0.0,
             calibration: DR-1}

    - name: crossbar
      per_parent: 8
      mesh: [3, 3]
      link: {name: "core<->crossbar", topology: star, params: {}, ns_per_hop: 1.0, pj_per_word: 0.0,
             calibration: DR-1}

  # the CiMLoop configs this fabric must stay consistent with
  cimloop:
    system: ws_chip2chip_link
    chip: mlx_die
    tile: mlx_core
    macro: wan_nature_2022